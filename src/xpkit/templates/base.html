<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Experiment readouts{% endblock %}</title>
<style>
 :root{--ink:#141414;--muted:#6e6e73;--line:#e5e5e7;--red:#e50914;--ok:#1a7f37;--bad:#b42318;--warn:#b26b00;--bg:#fafafa}
 *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
 header{background:#141414;color:#fff;padding:12px 20px} header a{color:#fff;text-decoration:none;font-weight:600}
 main{max-width:960px;margin:0 auto;padding:20px 16px}
 .banner{border-radius:10px;padding:16px 18px;margin:12px 0;color:#fff} .SHIP{background:var(--ok)} .NO_SHIP{background:var(--bad)}
 .INCONCLUSIVE{background:#5f6368} .INVALID{background:var(--warn)}
 .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;color:#fff}
 table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)} th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
 td.n{text-align:right;font-variant-numeric:tabular-nums} .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
 .muted{color:var(--muted);font-size:13px} svg{max-width:100%;height:auto}
 form label{display:block;margin:6px 0} input{font:inherit;padding:4px 6px}
</style></head>
<body><header><a href="/">Experiment readouts</a></header><main>{% block content %}{% endblock %}</main></body></html>
